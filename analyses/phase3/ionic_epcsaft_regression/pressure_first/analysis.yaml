id: pressure_first_reactive_vle
title: Pressure-first MEA reactive-VLE model screen
status: completed_diagnostic_not_promoted
summary: Freeze the pressure packet, compare exact M0/M1 pressure roots, and audit the neutral MEA-water direction against source-consistent Cai binary evidence.
owner: MEA-Thermodynamics Issue #13
inputs:
  - path: data/reference/MEA/manifests/reactive_vle_cross_validation.csv
    kind: curated_input
  - path: data/reference/MEA/manifests/pco2_metrology_manifest.csv
    kind: curated_input
  - path: data/reference/MEA/observations/vapor_liquid_equilibrium/Cai_1996_MEA_H2O_VLE.csv
    kind: curated_input
outputs:
  - path: results/pressure_candidate_packet.csv
    kind: immutable_packet
  - path: results/pressure_block_ladder_decision.json
    kind: scientific_decision
  - path: results/figures/pressure_block_ladder_diagnostic.svg
    kind: figure
  - path: results/figures/cai_baygi_binary_model_comparison_diagnostic.svg
    kind: figure
commands:
  generate:
    - uv run python analyses/phase3/ionic_epcsaft_regression/pressure_first/scripts/build_packet.py
    - uv run python analyses/phase3/ionic_epcsaft_regression/pressure_first/scripts/screen_pressure_parameter_directions.py --config analyses/phase3/ionic_epcsaft_regression/pressure_first/config/pressure_block_ladder.json
    - uv run python analyses/phase3/ionic_epcsaft_regression/pressure_first/scripts/screen_pressure_parameter_directions.py --config analyses/phase3/ionic_epcsaft_regression/pressure_first/config/m0_mea_water_direction_screen.json
    - uv run python analyses/phase3/ionic_epcsaft_regression/pressure_first/scripts/screen_pressure_parameter_directions.py --config analyses/phase3/ionic_epcsaft_regression/pressure_first/config/m1_source_fixed_screen.json
    - uv run python analyses/phase3/ionic_epcsaft_regression/pressure_first/scripts/fit_cai_mea_water_binary.py --config analyses/phase3/ionic_epcsaft_regression/pressure_first/config/cai_baygi_3b2b_binary_fit.json
    - uv run python analyses/phase3/ionic_epcsaft_regression/pressure_first/scripts/fit_cai_mea_water_binary.py --config analyses/phase3/ionic_epcsaft_regression/pressure_first/config/cai_baygi_3b4c_binary_fit.json
    - uv run python analyses/phase3/ionic_epcsaft_regression/pressure_first/scripts/summarize_pressure_block_ladder.py
  render:
    - uv run python analyses/phase3/ionic_epcsaft_regression/pressure_first/scripts/render_figures.py
runtime:
  class: expensive
  quick_seconds: 5
  full_seconds: 7200
manuscript_consumers: []
results_policy: Retain the immutable 121-row packet, exact M0/M1 pressure-root comparison, source-consistent Baygi binary fits, one final decision, and two PNG/SVG/PDF figure bundles. All results remain diagnostic and non-promotable.
