schema_version: 1
scientific_lane: nine_species_epcsaft_born_term_and_speciation_comparison
scientific_claim: >
  Nine-species ePC-SAFT parameter set F1 ae92bac5 (Debye-Hueckel and SSM+DS
  Born terms, explicit carbamate chemistry) for 30 wt% aqueous MEA, fitted
  through five binary interaction parameters to 47 CO2 pressures (40/60 degC,
  AARD 13.98 %) and 94 species targets (20-60 degC, AARD 8.26 %) on the
  corrected 141-target base. Outside the fit: 19.58 % on 21 rows at 80 degC;
  22.50 % and 22.27 % on 11 and 12 Wagner 2013 rows near 353 and 392 K, which
  entered no fit; 80 degC data informed fixed reaction shifts, so these are
  not independent temperature predictions. Bounded refits without the Born
  term give 53.60 % fitted-pressure AARD. The Born-form ranking reverses when
  Matin 2012 titration bicarbonate enters the fit. A source-law refit fits
  the data at or below 60 degC equally well but gives 28.91 % at 80 degC.
