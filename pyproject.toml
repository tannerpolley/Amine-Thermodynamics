[project]
name = "mea-thermodynamics"
version = "0.1.0"
description = "MEA-CO2-H2O thermodynamics workflows, diagnostics, and plot regeneration."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "matplotlib>=3.10",
    "numpy>=2.0",
    "pandas>=2.2",
    "pcsaft",
    "scipy>=1.15",
]

[dependency-groups]
test = [
    "pytest>=8.0",
    "ruff>=0.15",
]
dev = [
    { include-group = "test" },
]
idaes = [
    "idaes-pse>=2.8",
    "pyomo>=6.9",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
pcsaft = { git = "https://github.com/tannerpolley/PC-SAFT.git", rev = "eec3e7e4999c928e5015d2342b974c59a75d01d6" }

[tool.uv.extra-build-dependencies]
pcsaft = ["Cython>=3.0", "numpy>=2.0"]

[tool.ruff]
target-version = "py313"
src = ["src", "scripts", "analyses", "tests"]

[tool.ruff.lint.per-file-ignores]
"analyses/neutral_pcsaft_pressure_reference/scripts/render_figures.py" = ["E402"]
"analyses/six_species_solubility_reference/scripts/generate_data.py" = ["E402"]
"analyses/six_species_solubility_reference/scripts/render_figures.py" = ["E402"]
"analyses/ideal_reaction_equilibrium/scripts/generate_data.py" = ["E402"]
"analyses/ideal_reaction_equilibrium/scripts/render_figures.py" = ["E402"]
"analyses/paper_validation/2015_baygi/scripts/*.py" = ["E402"]
