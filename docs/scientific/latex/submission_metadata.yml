scientific_lane: explicit_ion_epcsaft_equilibrium_properties_loaded_mea
scientific_claim: >
  One explicit-ion ePC-SAFT formulation represents the selected equilibrium,
  caloric and density observations for nominal 30 wt% MEA. Its pressure
  deviations are within the range reported for related models on different
  data sets. The available comparisons do not yet establish its suitability
  across an absorber's operating range. Pressure AARD is 11.86% over 47 fitted
  observations and 20.55% over the 159-pressure comparison. Fitted species
  AARD is 7.10% over 94 observations, integral-heat RMSE 1.83 kJ/mol CO2 over
  eight observations, and loaded-density AARD 0.18% over 47 fitted observations.
  No descent was resolved in the finite search at 73 specified states
  (313.15-333.15 K, alpha 1e-5-0.5). Arcis is a selection comparison; Wagner
  and 15/45 wt% pressure comparisons were previously examined. Phase behavior
  and absorber or stripper performance are not physically validated.
