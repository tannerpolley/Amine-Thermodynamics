id: neutral_pcsaft_pressure_reference
title: Neutral PC-SAFT Pressure Reference
status: reference_case
summary: Evaluates the neutral ePC-SAFT runtime against the legacy PC-SAFT pressure curves on the shared Jou loading grid.
owner: project
inputs:
  - path: analyses/six_species_solubility_reference/results/pressure/legacy_pcsaft_jou_fit_curves.csv
    kind: canonical_pressure_reference
  - path: analyses/neutral_pcsaft_pressure_reference/results/pressure/epcsaft_neutral_jou_parity_curves.csv
    kind: retained_pressure_curves
  - path: analyses/neutral_pcsaft_pressure_reference/results/pressure/epcsaft_neutral_jou_parity_metrics.csv
    kind: retained_pressure_metrics
  - path: analyses/neutral_pcsaft_pressure_reference/results/pressure/epcsaft_neutral_jou_parity_summary.csv
    kind: retained_pressure_summary
outputs:
  - path: analyses/neutral_pcsaft_pressure_reference/results/pressure
    kind: canonical_pressure_results_and_plot_bundle
commands:
  render:
    - uv run python analyses/neutral_pcsaft_pressure_reference/scripts/render_figures.py
runtime:
  class: quick
  expected_seconds: 5
manuscript_consumers: []
results_policy: Track one canonical pressure result set and its exact plotted-data CSV, sidecar, PNG, SVG, and PDF bundle under results/pressure.
