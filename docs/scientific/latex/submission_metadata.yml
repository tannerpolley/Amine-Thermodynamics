scientific_lane: nine_species_epcsaft_joint_calibration_and_finite_phase_test
scientific_claim: >
  The restricted-bound fit jointly calibrates 16 parameters to 307 quantities in eight objective
  groups. Common pressure/species AARDs are 11.86/7.10%; fitted integral-heat
  RMSE is 1.83 kJ/mol CO2. Native loaded densities meet the declared 2s
  requirement at 44/47 fitted rows; three 353.15 K failures remain accepted
  with disclosure. No descent was numerically resolved in 657 trials at 73
  specified states (313.15-333.15 K, alpha 1e-5-0.5). This finite evidence
  establishes no stability outside those states, global optimum, unique
  parameters or physical validation of phase behavior or process performance.
  Arcis is a selection check; Wagner and 15/45 wt% pressure comparisons
  were previously accessed. Conditional errors depend on weights, fixed
  inputs, active bounds and local linearization.
