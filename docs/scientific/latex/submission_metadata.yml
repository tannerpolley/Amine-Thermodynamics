title: >
  Thermodynamics of CO₂-loaded aqueous monoethanolamine with ePC-SAFT: phase equilibria, speciation, absorption heat, density and phase stability
scientific_claim: >
  Joint estimation of equilibrium, caloric, density and binary data supports a common ePC-SAFT description of nominal 30 wt% loaded MEA.
  Pressure AARD is 11.86% for 47 fitted and 24.2% for 112 non-fitted pressures (20.55% overall).
  Species AARD is 7.10% over 94 fitted fractions; integral-heat RMSE is 1.84 kJ/mol CO₂; fitted loaded-density AARD is 0.18% over 47 observations.
  A wider-bound fit gives similar property agreement but detected instability at 54 states, compared with no additional liquid detected at 162 searched states for the final parameter set.
  Six parameters are on bounds; four of the other ten have conditional errors exceeding their absolute values; the R5 shift of 0.49 pK is within its conditional error of 0.55 pK.
  Concentration transfer, minor species and high-temperature properties remain limited; the phase search is numerical evidence, not physical validation.
  The brief MDEA demonstration identifies no generally preferable cation representation.
