schema_version: 1
scientific_lane: nine_species_epcsaft_born_term_and_speciation_comparison
scientific_claim: >
  Nine-species ePC-SAFT parameter set F1 66ff7715 (Debye-Hueckel and SSM+DS
  Born terms, explicit carbamate chemistry) for 30 wt% aqueous MEA, fitted
  through five binary interaction parameters to 47 CO2 pressures (40/60 degC,
  AARD 13.81 %) and 94 species targets (20-60 degC, AARD 7.89 %) on the
  corrected 141-target base. Wagner 2013 pressures near 80 and 119 degC, which
  entered no fitting or selection step: 23.11 % and 16.23 %. The other data at
  80-120 degC informed fixed reaction shifts and are not independent
  temperature tests. The bounded refit without the Born term gives 80.25 %
  fitted-pressure AARD. Fitting Matin 2012 titration bicarbonate changes which
  Born form has the lower cost. A source-law refit fits the data at or below
  60 degC equally well but gives 54.98 % at 100-120 degC.
