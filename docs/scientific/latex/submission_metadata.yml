schema_version: 1
scientific_lane: nine_species_epcsaft_born_term_and_speciation_comparison
scientific_claim: >
  Nine-species ePC-SAFT F1 66ff7715 for 30 wt% aqueous MEA fits five interaction
  coordinates to 47 pressures, 94 species targets and eight Vinjarapu integral
  heats (149 targets). Fitted pressure/species AARDs are 13.81 % / 7.89 %.
  Wagner pressures give 23.11 % near 80 degC and 16.23 % near 119 degC.
  Under the tested model, bounds, objective and two starts, Born-off fitted-pressure
  AARD is 80.25 %; no mechanism or physical-necessity claim follows.
  SSM+DS retains lower cost with and without Matin pool targets.
  Heat fitting improves calorimetry while Hilliard/Jou packet pressure AARD
  increases from 18.12 % to 29.66 % at 100 degC and 24.11 % to 41.55 % at
  120 degC; the canonical cohort is separately reported.
  The slope 107.96 +/- 22.93 K has conditional uncertainty.

