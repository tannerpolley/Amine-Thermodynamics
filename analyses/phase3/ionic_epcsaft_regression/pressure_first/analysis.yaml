    kind: curated_source_observations
outputs:
  - path: results/figures/cai_held_water_mea_family_summary.csv
    kind: historical_comparison_table
  - path: results/figures/cai_held_water_mea_family_comparison.svg
    kind: historical_figure
commands:
  render:
    - uv run python analyses/phase3/ionic_epcsaft_regression/pressure_first/scripts/render_figures.py
runtime:
