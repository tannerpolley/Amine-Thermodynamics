scientific_lane: explicit_ion_epcsaft_loaded_aqueous_amines
title: >
  Modeling CO₂ solubility in aqueous alkanolamine solutions with ePC-SAFT
history: one paper and one supplement, merged from the former Parts I and II (#400)
scientific_claim: >
  An explicit-ion ePC-SAFT model describes CO₂ solubility in aqueous MEA, DEA, MDEA and AMP with four calibrations on one fixed base that no amine data determine: water, CO₂ and the inorganic ions, the CO₂–water interaction, the R1–R3 equilibrium constants, and water–bicarbonate and water–carbonate interactions fitted to sodium-salt osmotic coefficients.
  MEA is fitted jointly to pressures, species fractions, absorption heats, heat capacities and densities with literature equilibrium constants; DEA, MDEA and AMP are each fitted through their own species and DEA and AMP each hold two parameters at their MEA values.
  Reactive, electroneutral phase-stability searches find no confirmed second liquid with any of the four models; for DEA the pressures of Lawson and Garst, for AMP the Hartono pressures above 353 K, which remove the second liquid of a calibration without them and the Tong pressures, and for MDEA the weight of the CO₂-free pressures decide whether a second liquid is predicted.
  The models supply thermodynamic properties for absorber calculations within the property-specific ranges and deviations the paper reports.
