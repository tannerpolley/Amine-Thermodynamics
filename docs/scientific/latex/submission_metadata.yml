scientific_lane: explicit_ion_epcsaft_equilibrium_properties_loaded_mea
title: >
  Thermodynamics of CO₂-loaded aqueous amines with ePC-SAFT. Part I: monoethanolamine benchmark for phase equilibria, speciation, absorption heat, density and phase stability
series: Part I of two; Part II (issue #320) transfers the frozen MEA shared parameters to MDEA, AMP, piperazine and DEA
scientific_claim: >
  Part I jointly estimates sixteen ePC-SAFT parameters for nominal 30 wt% loaded MEA from pressure, speciation, integral absorption heat, density, heat capacity and binary equilibrium data.
  Pressure AARD is 11.79% for 47 fitted pressures and 20.27% over 159 fitted and non-fitted pressures at 313.00–393.15 K.
  Species AARD is 7.11% for 94 of the 101 fitted fractions; fitted integral-heat RMSE is 1.84 kJ/mol CO₂; fitted loaded-density AARD is 0.162% without volume translation.
  A fit without a phase-stability requirement gives similar property agreement but has detected liquid-phase instability at 54 of 162 searched states.
  Penalizing tangent-plane instability gives a parameter set with no detected instability at the 1903 penalized states or at 738 states checked outside the fit.
  Six parameters lie on bounds; conditional covariance gives pressure standard errors of 5.41–16.00% at the 47 fitted pressure states.
  Pressure AARD at 15 and 45 wt% is 33.89% and 44.53%; bicarbonate/carbonate and higher-temperature caloric discrepancies are reported with their source conflicts and model assumptions.
  The finite phase searches are numerical verification of phase behavior, not physical validation.
