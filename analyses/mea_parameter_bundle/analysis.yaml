id: mea_parameter_bundle
title: Nine-Species MEA ePC-SAFT Parameter Bundle
status: active
summary: Live update-in-place research record of the active bundle, retained results, interpretation, limitations, and next experiments.
owner: MEA-Thermodynamics
children:
  - id: neutral-mea-water
    title: Neutral MEA–water fit
    category: formulation
    report: neutral-mea-water/index.qmd
  - id: association-topology
    title: Association topology analysis
    category: formulation
    report: association-topology/index.qmd
  - id: co2-r4-calibration
    title: CO₂ dispersion and R4 calibration
    category: formulation
    report: co2-r4-calibration/index.qmd
  - id: born-permittivity
    title: Born and permittivity study
    category: formulation
    report: born-permittivity/index.qmd
  - id: reaction-temperature-fit
    title: Reaction-temperature fit
    category: coupled_assessment
    report: reaction-temperature-fit/index.qmd
  - id: calorimetry
    title: Calorimetry and thermal assessment
    category: coupled_assessment
    report: calorimetry/index.qmd
  - id: coupling-and-identification
    title: Coupling and parameter identification
    category: coupled_assessment
    report: coupling-and-identification/index.qmd
  - id: ionic-speciation-fit
    title: Historical ionic/speciation fit
    category: historical_context
    report: ionic-speciation-fit/index.qmd
  - id: historical-designs
    title: Historical designs and discarded strategies
    category: historical_context
    report: historical-designs/index.qmd
inputs:
  - path: docs/ePC-SAFT/full-component-parameter-source-audit.md
    kind: local_parameter_provenance
  - path: docs/ePC-SAFT/amine-epcsaft-model-hierarchy-literature-review.md
    kind: selected_model_structure
  - path: analyses/mea_parameter_bundle/data/input/parameters.json
    kind: immutable_parameter_snapshot
  - path: analyses/mea_parameter_bundle/data/input/state-packet.json.gz
    kind: immutable_reactive_state_packet
  - path: analyses/mea_parameter_bundle/data/input/calorimetry-observation-partition.csv
    kind: paired_state_calorimetry_observation_view
  - path: data/reference/MEA/observations/calorimetry/MEA_heat_of_absorption_observations.csv
    kind: canonical_calorimetry_observations
  - path: analyses/enrtl_six_species_ideal_comparison/notebook.qmd
    kind: retained_species_reduction_and_sensitivity_analysis
  - path: analyses/enrtl_six_species_ideal_comparison/results/uq_run_receipt.json
    kind: packet_specific_sensitivity_record
  - path: data/reference/MEA/observations/liquid_speciation/Canonical_Combined_ChEq.csv
    kind: canonical_speciation_observations
  - path: data/reference/MEA/observations/vapor_liquid_equilibrium/Canonical_VLE_Observations.csv
    kind: canonical_vle_observations
  - path: analyses/mea_parameter_bundle/data/input/engine/epcsaft-0.2.0.dev0-cp313-cp313-linux_x86_64.whl
    kind: superseded_engine_wheel_40fba7cf_heat_and_engine_comparison_only
  - uri: https://github.com/tannerpolley/ePC-SAFT/issues/80
    kind: upstream_campaign
  - uri: https://github.com/tannerpolley/ePC-SAFT/issues/119
    kind: upstream_refinement_scope
  - uri: https://github.com/tannerpolley/ePC-SAFT/pull/134
    kind: unmerged_frozen_foundation_evidence
outputs:
  - path: analyses/mea_parameter_bundle/notebook.qmd
    kind: research_notebook_source
  - path: analyses/_site/mea_parameter_bundle/notebook-preview.html
    kind: research_notebook
  - path: analyses/mea_parameter_bundle/figures/speciation/output/speciation-diagnostic-replay.pdf
    kind: canonical_speciation_figure
  - path: analyses/mea_parameter_bundle/figures/speciation/output/speciation-diagnostic-replay-40C.pdf
    kind: additional_temperature_speciation_figure
  - path: analyses/mea_parameter_bundle/figures/speciation/output/speciation-diagnostic-replay-60C.pdf
    kind: additional_temperature_speciation_figure
  - path: analyses/mea_parameter_bundle/figures/speciation/output/speciation-diagnostic-replay-80C.pdf
    kind: additional_temperature_speciation_figure
  - path: analyses/mea_parameter_bundle/figures/pressure/output/pressure-diagnostic-replay.pdf
    kind: canonical_pressure_figure
  - path: analyses/mea_parameter_bundle/results/figure-calculation-record.json
    kind: calculation_record
  - path: analyses/mea_parameter_bundle/results/current-best-fit-residuals.csv
    kind: evaluated_target_residuals
  - path: analyses/mea_parameter_bundle/results/current-best-fit-statistics.csv
    kind: grouped_fit_statistics
  - path: analyses/mea_parameter_bundle/results/calorimetry/calorimetry-observation-partition-record.json
    kind: calorimetry_partition_provenance_and_checks
  - path: analyses/mea_parameter_bundle/results/historical/calorimetry/current-selected-gibbs-helmholtz-summary.json
    kind: historical_absorption_heat_diagnostic
  - path: analyses/mea_parameter_bundle/results/calorimetry/current-selected-direct-enthalpy-summary.json
    kind: selected_bundle_direct_total_enthalpy_summary
  - path: analyses/mea_parameter_bundle/results/calorimetry/current-selected-direct-enthalpy-comparison.csv
    kind: selected_bundle_direct_total_enthalpy_comparison
  - path: analyses/mea_parameter_bundle/results/calorimetry/current-selected-direct-enthalpy-attempts.csv
    kind: selected_bundle_direct_total_enthalpy_solver_attempts
  - path: analyses/mea_parameter_bundle/results/calorimetry/current-selected-reference-thermochemistry.json
    kind: reaction_consistent_reference_thermochemistry
  - path: analyses/mea_parameter_bundle/figures/historical/calorimetry/output/current-selected-calorimetry-diagnostic.pdf
    kind: historical_absorption_heat_figure
  - path: analyses/mea_parameter_bundle/figures/calorimetry/output/current-selected-direct-enthalpy.pdf
    kind: selected_bundle_direct_total_enthalpy_figure
  - path: analyses/mea_parameter_bundle/results/parameter-start-comparison.csv
    kind: retained_parameter_comparison
  - path: analyses/mea_parameter_bundle/results/parameter-sensitivity-screen.csv
    kind: retained_parameter_sensitivity
  - path: analyses/mea_parameter_bundle/results/quick-endpoint-perturbation-screen.csv
    kind: retained_direct_bubble_endpoint_screen
  - path: analyses/mea_parameter_bundle/results/quick-endpoint-perturbation-record.json
    kind: retained_endpoint_screen_record
  - path: analyses/mea_parameter_bundle/results/best-in-slot-campaign/final-full-validation-summary.csv
    kind: selected_candidate_full_validation_summary
  - path: analyses/mea_parameter_bundle/results/best-in-slot-campaign/final-full-validation-evaluations.csv
    kind: selected_candidate_row_level_validation
  - path: analyses/mea_parameter_bundle/results/historical/permittivity-formulation-comparison.json
    kind: historical_permittivity_model_comparison
  - path: analyses/mea_parameter_bundle/results/selected-current-best-parameters.json
    kind: active_parameter_mapping
  - path: analyses/mea_parameter_bundle/results/born-permittivity-study/current-fast-common-comparison.csv
    kind: reaction_synchronized_common_target_comparison
  - path: analyses/mea_parameter_bundle/figures/born_permittivity/output/current-fast-born-reaction-comparison.pdf
    kind: reaction_synchronized_born_and_reaction_comparison_figure
  - path: analyses/mea_parameter_bundle/results/born-permittivity-study/selected-bundle-joint-sensitivity-common-targets.csv
    kind: selected_bundle_born_and_solvation_sensitivity
  - path: analyses/mea_parameter_bundle/figures/born_permittivity/output/selected-bundle-joint-sensitivity.pdf
    kind: selected_bundle_born_and_solvation_sensitivity_figure
  - path: analyses/mea_parameter_bundle/results/born-permittivity-study/selected-bundle-f1p5-hco3p10-full-common-comparison.csv
    kind: full_selected_bundle_and_born_solvation_candidate_comparison
  - path: analyses/mea_parameter_bundle/figures/born_permittivity/output/selected-bundle-full-candidate-comparison.pdf
    kind: full_selected_bundle_and_born_solvation_candidate_figure
  - path: analyses/mea_parameter_bundle/figures/permittivity_comparison/output/permittivity-formulation-parity.pdf
    kind: retained_permittivity_comparison_figure
  - path: analyses/mea_parameter_bundle/results/reaction-temperature-fit/adoption-record.json
    kind: reaction_temperature_fit_adoption_decision
  - path: analyses/mea_parameter_bundle/results/reaction-temperature-fit/full-validation-targets.csv
    kind: reaction_temperature_fit_full_replay_targets
  - path: analyses/mea_parameter_bundle/results/calorimetry/thermal-reference-validation.json
    kind: anchored_thermal_reference_validation
commands:
  refresh:
    - uv run python scripts/refresh_results.py
  analyze:
    - uv run python scripts/compare_permittivity_formulations.py --parameters PATH
    - uv run python scripts/prepare_calorimetry_partition.py
    - uv run python scripts/evaluate_absorption_heat_diagnostic.py
    - uv run python scripts/evaluate_direct_absorption_heat.py
    - uv run python scripts/generate_figure_data.py
    - uv run python scripts/run_direct_parameter_campaign.py --phase PHASE --preset PRESET --workers 1
    - uv run python scripts/run_reaction_temperature_fit.py [--parity|--benchmark|--candidate|--full|--sensitivity-check|--adopt]
    - uv run python scripts/validate_thermal_references.py --equilibrium
    - uv run python scripts/render_figures.py
    - uv run python scripts/render_regression_overview.py
    - uv run python scripts/build_absorption_handoff.py
  render:
    - uv run python scripts/result_freshness.py --certify
runtime:
  class: pinned_engine_replay
  refresh_wall_seconds: 3600
  refresh_state_timeout_seconds: 180
  refresh_logical_cpus: 1
  refresh_solver_address_space_mib: 2048
  refresh_quarto_v8_heap_mib: 2048
parameter_status: exploratory_incumbent
parameter_record: analyses/mea_parameter_bundle/results/selected-current-best-parameters.json
parameter_record_history: analyses/mea_parameter_bundle/results/parameter-record-history.csv
holdout_ledger: analyses/mea_parameter_bundle/results/holdout-evaluations.csv
results_policy: Keep one parameter-first Quarto notebook and self-contained HTML, with a five-minute outcome-based analysis and linked supporting evidence; retain calculation authority in the identified inputs and results.
